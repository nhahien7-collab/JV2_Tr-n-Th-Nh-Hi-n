<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trần Thị Nhã Hiền</title>
</head>
<body>
    <table border="1">
        <tr>
            <td>Component</td>
            <td>Display</td>
        </tr>
        <tr>
            <td>
                Input text
            </td>
            <td>
                <form>
                    <input type="text" placeholder=""/><br>
                </form>
            </td>
        </tr>
        <tr>
            <td>
                Textarea
            </td>
            <td>
                <form>
                    <textarea rows="4" cols="20"></textarea>
                </form>
            </td>
        </tr>
        <tr>
            <td>
                Button
            </td>
            <td>
                <form>
                    <button type ="button">Click me</button>
                </form>
            </td>
        </tr>
        <tr>
            <td>
                Radio
            </td>
            <td>
                <form>
                    <input type="radio" name="option1" value="0">Option 1<br>
                    <input type="radio" name="option2" value="0">Option 2<br>
                    <input type="radio" name="option3" value="0">Option 3
                </form>
            </td>
            
        </tr>
        <tr>
            <td>
                Multiple<br> selention
            </td>
            <td>
                <form>
                    <input type="checkbox" name="checkbox1" value="0">Option 1<br>
                    <input type="checkbox" name="checkbox2" value="0">Option 2<br>
                    <input type="checkbox" name="checkbox3" value="0">Option 3
                </form>
            </td>
        </tr>
        <tr>
            <td>
                Dropdown
            </td>
            <td>
                <form>
                    <select>
                        <option value="1">Option 1</option>
                        <option value="2">Option 2</option>
                        <option value="3">Option 3</option>
                    </select>
                </form>
            </td>
        </tr>
        <tr>
            <td>
                File select
            </td>
            <td>
                <form>
                    <input type="file">
                </form>
            </td>
        </tr>
    </table>

    
</body>
</html>
