<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trần Thị Nhã Hiền</title>
   <!-- Cách 1: dùng liên kết đến file css -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Cách 2: Dùng thẻ style -->
    <style>
        body{background-color: #ecf9f2;}
        p{text-align: center; font-size: 20pt !important}    

        #post1 {color: blue;}
        .colorRed{color: red;}

        .borderDouble{border:10px double white;}
    </style>
</head>

<body>
    <h1>Trần Thị Nhã Hiền</h1>
    <p>Đây là một đoạn văn bản</p>
    <!-- Cách 3: Dùng thuộc tính style trực tiếp trong thẻ html -->
    <p style="text-align:right; font-size:50pt "  >Đây là một đoạn văn bản</p>
    <p style="text-transform: uppercase; font-size:50pt "  >Đây là một đoạn văn bản</p>
    <!-- "!IMPORTANT" DÙNG ĐỂ CHỌN CSS CÓ ĐỘ ƯU TIÊN CAO NHẤT  -->

    <p id="post1" class="colorRed"> "!IMPORTANT" DÙNG ĐỂ CHỌN CSS CÓ ĐỘ ƯU TIÊN CAO NHẤT  </p>
    <!-- Kết luận: CSS của id ưu tiên hơn CSS của class, 
     và CSS của class ưu tiên hơn CSS html. 
     Nhưng nếu dùng !important thì sẽ ưu tiên hơn tất cả -->

    <div style="width: 45%; background-color: red; padding-bottom: 15px;">
        <img src="img/hinh1.jpg" alt="logo" width="100px">
    </div>

    <!-- Thêm class .borderDouble -->
    <div class="borderDouble" style="width: 300px; background-color: green; margin-top:15px">
        <img src="img/hinh1.jpg" alt="logo" width="100px">
    </div>
    
    margin: 15px 14px 13px 12px;

    <!-- margin: "top" "right" "bottom" "left" -->

    margin: 15px 5px; 

    <!-- margin: "top và bot" "left và right"; -->

    margin: 15px; 

    <!-- margin: "top bottom left right"; -->
</body>
</html>
